apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: obsidian-config-pvc
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: obsidian-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: obsidian-web
  template:
    metadata:
      labels:
        app: obsidian-web
    spec:
      containers:
        - name: obsidian
          image: lscr.io/linuxserver/obsidian:latest
          ports:
            - containerPort: 32000 # HTTP
            - containerPort: 32001 # HTTPS
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "Australia/Melbourne"
          volumeMounts:
            - name: config
              mountPath: /config
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: obsidian-config-pvc
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: obsidian-web
spec:
  type: NodePort
  selector:
    app: obsidian-web
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      nodePort: 32000
    - name: https
      port: 3001
      targetPort: 3001
      nodePort: 32001

