# Trivy configuration
# https://trivy.dev/latest/docs/references/configuration/config-file/
#
# The CI workflow currently sets scan options explicitly in
# .github/workflows/main.yml. You can move shared defaults here and
# pass this file with `trivy-config: .trivy/config.yaml` if desired.

scan:
  scanners:
    - vuln
    - secret
    - misconfig

severity:
  - CRITICAL
  - HIGH

ignore-unfixed: true
exit-code: 1