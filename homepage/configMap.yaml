apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage
  namespace: default
  labels:
    app.kubernetes.io/name: homepage
data:
  kubernetes.yaml: |
    mode: cluster
  settings.yaml: ""
  #settings.yaml: |
  #  providers:
  #    longhorn:
  #      url: https://longhorn.my.network
  custom.css: ""
  custom.js: ""
  proxmox.yaml: ""
  bookmarks.yaml: |
    - Developer:
        - Github:
            - abbr: GH
              href: https://github.com/j-frances
              icon: /icons/github.png
  services.yaml: |
    - Applications:
        - Linkding:
            href: http://192.168.1.147:9090/
            description: A self-hosted bookmark manager designed to be minimal, fast, and easy to set up.
            icon: /icons/linkding.png
        - Obsidian:
            href: https://192.168.1.147:32001/
            description: The free and flexible app for your private thoughts.
            icon: /icons/obsidian.png
  widgets.yaml: |
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: "cluster"
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true
    - resources:
        backend: resources
        expanded: true
        cpu: true
        memory: true
        network: default
    - search:
        provider: duckduckgo
        target: _blank
  docker.yaml: ""